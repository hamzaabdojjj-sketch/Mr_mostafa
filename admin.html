*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--navy);color:var(--text);line-height:1.8;min-height:100vh}
h1,h2{font-family:"Reem Kufi",sans-serif}
.wrap{width:min(900px,94%);margin:0 auto;padding:1.5rem 0 3rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
header h1{color:var(--gl);font-size:1.4rem}
button,select,input,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--soft);border:1px solid rgba(148,163,184,.3);border-radius:10px;padding:.6rem .9rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
button{background:var(--gold);color:var(--deep);border:0;border-radius:999px;padding:.5rem 1.2rem;font-weight:600;cursor:pointer}
button.del{background:transparent;color:#fca5a5;border:1px solid #fca5a5}
button.ghost{background:transparent;color:var(--gl);border:1px solid var(--gold)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabs button.on{background:var(--gold);color:var(--deep)}
.panel{display:none}.panel.on{display:block}
form{display:grid;gap:.7rem;background:rgba(10,16,32,.72);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1.2rem}
.row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.8rem 0;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:180px}
small{display:block;color:var(--muted)}
.tag{padding:.1rem .7rem;border-radius:999px;font-size:.85rem}
.ok{background:rgba(34,197,94,.18);color:#86efac}.wait{background:rgba(245,158,11,.18);color:var(--gl)}
#login{max-width:380px;margin:12vh auto;padding:0 1rem}
.err{color:#fca5a5;min-height:1.5em;margin-top:.5rem}
footer{text-align:center;color:var(--muted);font-size:.9rem;margin-top:2rem;direction:ltr}
[hidden]{display:none!important}
.qc{border:1px solid var(--line);border-radius:12px;padding:.9rem;display:grid;gap:.6rem;background:rgba(15,23,42,.8)}
.qc .top{display:flex;justify-content:space-between;align-items:center}.qc .top b{color:var(--gl)}
.qc .ans{display:flex;gap:.6rem;align-items:center}.qc .ans select{width:auto}
.imgf{display:grid;gap:.4rem;justify-items:start}
img.pv{max-width:100%;max-height:260px;border-radius:8px;background:#fff}
.qtabs{display:flex;gap:.5rem}.qtabs button{background:transparent;color:var(--muted);border:1px solid var(--line)}.qtabs button.on{background:var(--gold);color:var(--deep)}
.qc input[type=radio],.qc input[type=checkbox]{width:auto;padding:0;accent-color:var(--gold)}
.orow{display:grid;grid-template-columns:auto 1fr;gap:.5rem .7rem;align-items:start;border:1px solid var(--line);border-radius:10px;padding:.6rem}
.orow>b{color:var(--gl);font-size:1.2rem;padding-top:.3rem}.orow .imgf{width:100%}
.radios{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}.radios label{display:flex;gap:.35rem;align-items:center;cursor:pointer}
.qc .mk{display:flex;gap:.6rem;align-items:center}.qc .mk input{width:110px}
#essays img{max-width:100%;border-radius:8px;margin-top:.4rem;background:#fff}
</style>
</head>
<body>

<div id="login">
  <h1 style="color:var(--gl);margin-bottom:1rem">لوحة المالك</h1>
  <form id="lf">
    <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
    <button type="submit">دخول</button>
  </form>
  <div class="err" id="lerr"></div>
</div>

<div class="wrap" id="app" hidden>
  <header><h1>لوحة المالك</h1><div style="display:flex;gap:.6rem"><button class="ghost" id="site" type="button">عرض الموقع</button><button class="ghost" id="out">تسجيل خروج</button></div></header>
  <div class="err" id="msg" role="alert"></div>
  <div class="tabs" id="tabs">
    <button data-p="p1" class="on">الطلبة</button>
    <button data-p="p2">الدرجات</button>
    <button data-p="p3">الكتب والامتحانات</button>
    <button data-p="p4">محتوى عام</button>
    <button data-p="p5">الاختبارات</button>
  </div>

  <section class="panel on" id="p1"><div id="slist"></div></section>

  <section class="panel" id="p2">
    <form id="gf">
      <select id="gs" required></select>
      <input id="ge" placeholder="اسم الامتحان" required>
      <input id="gsc" type="number" step="any" min="0" placeholder="الدرجة" required>
      <input id="gm" type="number" step="any" min="1" placeholder="الدرجة النهائية" required>
      <button type="submit">إضافة درجة</button>
    </form>
    <div id="glist"></div>
  </section>

  <section class="panel" id="p3">
    <form id="mf">
      <input id="mt" placeholder="العنوان" required>
      <select id="mg"><option>الكل</option><option>الأول الإعدادي</option><option>الثاني الإعدادي</option><option>الثالث الإعدادي</option><option>الأول الثانوي</option><option>الثاني الثانوي</option><option>الثالث الثانوي</option></select>
      <select id="my"><option>كتاب</option><option>مذكرة</option><option>امتحان</option></select>
      <input id="mu" type="url" placeholder="رابط الملف (https://...)" required>
      <button type="submit">إضافة</button>
    </form>
    <div id="mlist"></div>
  </section>

  <section class="panel" id="p4">
    <form id="pf">
      <input id="pt" placeholder="العنوان" required>
      <textarea id="px" placeholder="النص"></textarea>
      <input id="pi" type="url" placeholder="رابط صورة (اختياري، https://...)">
      <button type="submit">نشر</button>
    </form>
    <div id="plist"></div>
  </section>
  <section class="panel" id="p5">
    <form id="ef">
      <input id="et" placeholder="عنوان الاختبار" required>
      <select id="eg"><option>الكل</option><option>الأول الإعدادي</option><option>الثاني الإعدادي</option><option>الثالث الإعدادي</option><option>الأول الثانوي</option><option>الثاني الثانوي</option><option>الثالث الثانوي</option></select>
      <div id="qb"></div>
      <button type="button" class="ghost" id="addQ">+ إضافة سؤال</button>
      <button type="submit">إضافة الاختبار</button>
    </form>
    <h2 style="margin:1rem 0 .3rem">الاختبارات</h2><div id="elist"></div>
    <h2 style="margin:1.4rem 0 .3rem">نتائج الطلبة</h2><div id="rlist"></div>
    <h2 style="margin:1.4rem 0 .3rem">إجابات الأسئلة المقالية</h2><div id="essays"></div>
  </section>
  <footer>Created by Abdo Hamza</footer>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";
import {getFirestore,collection,doc,getDocs,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,orderBy,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyB2ftcUWyDBSXPyGOvCxHgiWxAdEqW75_M",
  authDomain:"mostafa-portfolio-12a36.firebaseapp.com",
  projectId:"mostafa-portfolio-12a36",
  storageBucket:"mostafa-portfolio-12a36.firebasestorage.app",
  messagingSenderId:"846216607520",
  appId:"1:846216607520:web:dfafe8927438234a7c8945"
});
const auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const ADMINS=["P1XhskuICCdGS1C6PYTASGfJKbq1","pY7VIVQ7LOeQGn490FICX7AsmMe2"];
const $=s=>document.querySelector(s);
let students=[];

// يبني عناصر بـ textContent فقط (آمن ضد أي نص يكتبه الطلبة)
function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(x=>e.append(x));
  return e;
}
let mt;
function msg(t){$('#msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('#msg').textContent='',6000)}
async function run(fn){try{await fn()}catch(e){msg('حدث خطأ: '+(e.code||e.message))}}
const okUrl=u=>/^https:\/\//i.test(u);

// Auth
$('#lf').addEventListener('submit',e=>{
  e.preventDefault();$('#lerr').textContent='';
  signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)
    .catch(()=>$('#lerr').textContent='البريد أو كلمة المرور غير صحيحة.');
});
$('#out').onclick=()=>signOut(auth);
$('#site').onclick=()=>{location.href='index.html#site'};
onAuthStateChanged(auth,u=>{
  if(!u){$('#login').hidden=false;$('#app').hidden=true;return}
  if(!ADMINS.includes(u.uid)){
    $('#login').hidden=false;$('#app').hidden=true;$('#lerr').textContent='هذا الحساب غير مصرح له بدخول لوحة المالك.';return;
  }
  $('#login').hidden=true;$('#app').hidden=false;
  run(()=>Promise.all([loadStudents().then(loadResults),loadDocs('materials','#mlist'),loadDocs('public','#plist'),loadDocs('exams','#elist')]));
});

// Tabs
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.p).classList.add('on');
});

// Students
async function loadStudents(){
  const s=await getDocs(collection(db,'users'));
  students=s.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(!!a.approved-!!b.approved)||(a.name||'').localeCompare(b.name||'','ar'));
  const pc=students.filter(x=>!x.approved).length;document.querySelector('[data-p=p1]').textContent='الطلبة'+(pc?' ('+pc+' جديد)':'');
  const list=$('#slist');
  list.replaceChildren(...(students.length?students.map(st=>h('div',{class:'row'},
    h('div',{class:'grow'},h('b',{},st.name||'-'),h('small',{},(st.grade||'')+' · '+(st.email||''))),
    h('span',{class:'tag '+(st.approved?'ok':'wait')},st.approved?'معتمد':'بانتظار الموافقة'),
    h('button',{onclick:()=>run(async()=>{await updateDoc(doc(db,'users',st.id),{approved:!st.approved});await loadStudents()})},st.approved?'إلغاء الموافقة':'موافقة'),
    h('button',{class:'del',onclick:()=>run(async()=>{
      if(!confirm('حذف بيانات الطالب '+(st.name||'')+'؟'))return;
      await deleteDoc(doc(db,'users',st.id));
      await deleteDoc(doc(db,'grades',st.id));
      await loadStudents();
    })},'حذف')
  )):[h('p',{},'لا يوجد طلبة مسجلين بعد.')]));
  $('#gs').replaceChildren(h('option',{value:''},'اختر الطالب'),...students.map(st=>h('option',{value:st.id},(st.name||'-')+' - '+(st.grade||''))));
  await loadGrades();
}

// Grades
async function getItems(uid){const d=await getDoc(doc(db,'grades',uid));return d.exists()?(d.data().items||[]):[]}
async function loadGrades(){
  const uid=$('#gs').value,box=$('#glist');
  if(!uid){box.replaceChildren();return}
  const items=await getItems(uid);
  box.replaceChildren(...(items.length?items.map((it,i)=>h('div',{class:'row'},
    h('div',{class:'grow'},h('b',{},it.exam),h('small',{},it.date||'')),
    h('span',{},it.score+' / '+it.max),
    h('button',{class:'del',onclick:()=>run(async()=>{
      const cur=await getItems(uid);cur.splice(i,1);
      await setDoc(doc(db,'grades',uid),{items:cur});await loadGrades();
    })},'حذف')
  )):[h('p',{},'لا توجد درجات لهذا الطالب.')]));
}
$('#gs').addEventListener('change',()=>run(loadGrades));
$('#gf').addEventListener('submit',e=>{e.preventDefault();run(async()=>{
  const uid=$('#gs').value;if(!uid)return msg('اختر الطالب أولاً.');
  const items=await getItems(uid);
  items.push({exam:$('#ge').value.trim(),score:+$('#gsc').value,max:+$('#gm').value,date:new Date().toISOString().slice(0,10)});
  await setDoc(doc(db,'grades',uid),{items});
  $('#ge').value='';$('#gsc').value='';
  await loadGrades();
})});

// Materials & public content
async function loadDocs(col,sel){
  const s=await getDocs(query(collection(db,col),orderBy('createdAt','desc')));
  $(sel).replaceChildren(...(s.docs.length?s.docs.map(d=>{
    const x=d.data();
    return h('div',{class:'row'},
      h('div',{class:'grow'},h('b',{},x.title||''),h('small',{},col==='materials'?(x.type+' · '+x.grade):col==='exams'?((x.grade||'')+' · '+(x.count||(x.questions||[]).length)+' سؤال'):(x.text||''))),
      h('button',{class:'del',onclick:()=>run(async()=>{
        if(!confirm('حذف؟'))return;
        if(col==='exams'){const qs=await getDocs(query(collection(db,'questions'),where('examId','==',d.id)));for(const z of qs.docs)await deleteDoc(z.ref)}
        if(col==='exams')for(const q of x.questions||[])for(const id of [q.imgId,q.expImgId])if(id)await deleteDoc(doc(db,'qimgs',id)).catch(()=>{});
        await deleteDoc(doc(db,col,d.id));await loadDocs(col,sel);
      })},'حذف'));
  }):[h('p',{},'لا يوجد محتوى بعد.')]));
}
$('#mf').addEventListener('submit',e=>{e.preventDefault();run(async()=>{
  const url=$('#mu').value.trim();if(!okUrl(url))return msg('الرابط لازم يبدأ بـ https://');
  await addDoc(collection(db,'materials'),{title:$('#mt').value.trim(),grade:$('#mg').value,type:$('#my').value,url,createdAt:serverTimestamp()});
  $('#mf').reset();await loadDocs('materials','#mlist');
})});
$('#pf').addEventListener('submit',e=>{e.preventDefault();run(async()=>{
  const img=$('#pi').value.trim();if(img&&!okUrl(img))return msg('رابط الصورة لازم يبدأ بـ https://');
  await addDoc(collection(db,'public'),{title:$('#pt').value.trim(),text:$('#px').value.trim(),imageUrl:img,createdAt:serverTimestamp()});
  $('#pf').reset();await loadDocs('public','#plist');
})});

function shrink(file,max=1400,cap=240000){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const k=Math.min(1,max/Math.max(im.width,im.height));let w=Math.max(1,Math.round(im.width*k)),hh=Math.max(1,Math.round(im.height*k)),d='';
  const c=document.createElement('canvas'),x=c.getContext('2d');
  for(let i=0;i<12;i++){c.width=w;c.height=hh;x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0,w,hh);d=c.toDataURL('image/jpeg',.82);if(d.length<=cap)break;w=Math.round(w*.85);hh=Math.round(hh*.85)}
  d.length<=cap?res(d):rej(new Error('big'))};im.src=r.result};r.readAsDataURL(file)})}

// ===== نظام الأسئلة: كروت ديناميكية (نص أو صورة) + 4 اختيارات (نص أو صورة) =====
const LT=['أ','ب','ج','د'],LK=['a','b','c','d'];
function imgField(label,max,cap){
  const st={data:''};
  const inp=h('input',{type:'file',accept:'image/*'});
  const pv=h('img',{class:'pv',alt:'',style:'max-height:140px'});pv.hidden=true;
  const clr=h('button',{type:'button',class:'del'},'إزالة الصورة');clr.hidden=true;
  inp.addEventListener('change',async()=>{
    const f=inp.files[0];if(!f)return;
    try{st.data=await shrink(f,max,cap);pv.src=st.data;pv.hidden=false;clr.hidden=false}
    catch(e){msg('تعذّر تجهيز الصورة، جرّب صورة تانية.');inp.value='';st.data='';pv.hidden=true;clr.hidden=true}
  });
  clr.onclick=()=>{st.data='';inp.value='';pv.hidden=true;clr.hidden=true};
  st.el=h('div',{class:'imgf'},h('small',{},label),inp,pv,clr);
  return st;
}
// رفع على Firebase Storage؛ لو Storage مش مفعّل بنخزّن الصورة المضغوطة داخل المستند نفسه
let storageWarned=false;
async function putImg(d){
  if(!d)return null;
  try{
    const blob=await (await fetch(d)).blob();
    const r=sref(storage,'exam-images/'+Date.now()+'-'+Math.random().toString(36).slice(2,9)+'.jpg');
    await uploadBytes(r,blob,{contentType:'image/jpeg'});
    return await getDownloadURL(r);
  }catch(e){
    if(!storageWarned){storageWarned=true;msg('Firebase Storage مش شغال، الصور هتتحفظ جوه الاختبار نفسه.')}
    return d;
  }
}
function renum(){[...$('#qb').children].forEach((c,i)=>c.querySelector('.top b').textContent='سؤال '+(i+1))}
let qSeq=0;
function addQ(){
  const id=++qSeq;
  const c=h('div',{class:'qc'});
  const rm=h('button',{type:'button',class:'del'},'حذف السؤال');
  const t1=h('button',{type:'button',class:'on'},'كتابة نص'),t2=h('button',{type:'button'},'رفع صورة');
  const qt=h('textarea',{rows:'3',placeholder:'اكتب السؤال هنا'});
  const qi=imgField('ارفع صورة السؤال (مناسب للرياضة والمعادلات)',1400,240000);qi.el.hidden=true;
  let mode='text';
  const setMode=m=>{mode=m;t1.classList.toggle('on',m==='text');t2.classList.toggle('on',m==='img');qt.hidden=m!=='text';qi.el.hidden=m!=='img'};
  t1.onclick=()=>setMode('text');t2.onclick=()=>setMode('img');
  const opts=LT.map((l,k)=>{
    const tx=h('input',{placeholder:'نص الاختيار '+l});
    const im=imgField('أو صورة الاختيار '+l,900,140000);
    return {tx,im,el:h('div',{class:'orow'},h('b',{},l),h('div',{style:'display:grid;gap:.4rem'},tx,im.el))};
  });
  const radios=LT.map((l,k)=>h('label',{},h('input',{type:'radio',name:'ans'+id,value:k}),l));
  const ansBox=h('div',{class:'radios'},h('span',{},'الإجابة الصحيحة:'),...radios);
  const optBox=h('div',{style:'display:grid;gap:.6rem'},...opts.map(o=>o.el));
  const essay=h('input',{type:'checkbox'});
  essay.addEventListener('change',()=>{optBox.hidden=ansBox.hidden=essay.checked});
  const marks=h('input',{type:'number',min:'0',step:'any',value:'1'});
  rm.onclick=()=>{c.remove();renum()};
  c._f={get mode(){return mode},qt,qi,opts,essay,marks};
  c.append(h('div',{class:'top'},h('b',{}),rm),h('div',{class:'qtabs'},t1,t2),qt,qi.el,optBox,ansBox,
    h('label',{class:'mk',style:'cursor:pointer'},essay,h('span',{},'سؤال مقالي (الطالب يكتب أو يصوّر إجابته، ومش بيتصحح أوتوماتيك)')),
    h('div',{class:'mk'},h('span',{},'درجة السؤال:'),marks));
  $('#qb').append(c);renum();
}
$('#addQ').onclick=addQ;addQ();
function readCards(){
  return [...$('#qb').children].map((c,n)=>{
    const f=c._f,N='سؤال '+(n+1)+': ';
    const text=f.mode==='text'?f.qt.value.trim():'',img=f.mode==='img'?f.qi.data:'';
    if(!text&&!img)throw new Error(N+(f.mode==='text'?'اكتب نص السؤال.':'ارفع صورة السؤال.'));
    const mk=+f.marks.value;if(!(mk>0))throw new Error(N+'اكتب درجة السؤال.');
    const o=f.opts.map(x=>({t:x.tx.value.trim(),i:x.im.data}));
    let ans=-1;
    if(!f.essay.checked){
      if(!(o[0].t||o[0].i)||!(o[1].t||o[1].i))throw new Error(N+'لازم الاختيارين أ و ب على الأقل.');
      const r=c.querySelector('input[type=radio]:checked');if(!r)throw new Error(N+'اختار الإجابة الصحيحة.');
      ans=+r.value;if(!(o[ans].t||o[ans].i))throw new Error(N+'الإجابة الصحيحة لازم تكون اختيار مكتوب أو مرفوع بصورة.');
    }
    return {essay:f.essay.checked,text,img,o,ans,mk};
  });
}
$('#ef').addEventListener('submit',e=>{e.preventDefault();run(async()=>{
  const title=$('#et').value.trim();
  if(!$('#qb').children.length)return msg('أضف سؤال واحد على الأقل.');
  let qs;try{qs=readCards()}catch(err){return msg(err.message)}
  const btn=$('#ef button[type=submit]');btn.disabled=true;
  const made=[];let examRef=null;
  try{
    const total=qs.reduce((a,q)=>a+(q.essay?0:q.mk),0);
    btn.textContent='جاري الحفظ...';
    examRef=await addDoc(collection(db,'exams'),{title,grade:$('#eg').value,count:qs.length,totalMarks:total,createdAt:serverTimestamp()});
    for(const [i,q] of qs.entries()){
      btn.textContent='جاري حفظ السؤال '+(i+1)+' / '+qs.length;
      const data={examId:examRef.id,order:i,type:q.essay?'essay':'mcq',
        question_text:q.text||null,question_image_url:await putImg(q.img),correct_answer:q.essay?null:LK[q.ans],marks:q.mk};
      for(let k=0;k<4;k++){data['option_'+LK[k]+'_text']=q.o[k].t||null;data['option_'+LK[k]+'_image_url']=q.essay?null:await putImg(q.o[k].i)}
      made.push(await addDoc(collection(db,'questions'),data));
    }
    $('#ef').reset();$('#qb').replaceChildren();addQ();
    msg('اتضاف الاختبار ('+qs.length+' سؤال).');await loadDocs('exams','#elist');
  }catch(err){
    for(const r of made)await deleteDoc(r).catch(()=>{});
    if(examRef)await deleteDoc(examRef).catch(()=>{});
    throw err;
  }finally{btn.disabled=false;btn.textContent='إضافة الاختبار'}
})});
async function loadResults(){
  const s=await getDocs(collection(db,'results'));
  const name=id=>(students.find(x=>x.id===id)||{}).name||'-';
  $('#rlist').replaceChildren(...(s.docs.length?s.docs.map(d=>{const r=d.data();
    return h('div',{class:'row'},h('div',{class:'grow'},h('b',{},name(r.uid)),h('small',{},r.examTitle||'')),h('span',{},r.score+' / '+r.max))
  }):[h('p',{},'لا توجد نتائج بعد.')]));
  try{
    const es=await getDocs(collection(db,'essays'));
    $('#essays').replaceChildren(...(es.docs.length?es.docs.map(d=>{const r=d.data();
      return h('div',{class:'row',style:'display:block'},h('b',{},name(r.uid)+' — '+(r.examTitle||'')+' — سؤال '+((r.qIndex||0)+1)),
        r.text?h('p',{},r.text):'',/^data:image\//.test(r.img||'')?h('img',{src:r.img,alt:''}):'')
    }):[h('p',{},'لا توجد إجابات مقالية بعد.')]));
  }catch(e){$('#essays').textContent='تعذّر تحميل الإجابات المقالية (راجع قواعد Firestore).'}
}
</script>
